<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Logo Mister Softs</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,900;1,900&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        background-color: #0c4331;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        font-family: 'Montserrat', sans-serif;
        overflow: hidden;
      }

      .logo-container {
        display: flex;
        align-items: baseline;
        user-select: none;
        position: relative;
      }

      /* --- LETRA M CON CIRCUITOS --- */
      .logo-m-wrapper {
        position: relative;
        font-style: italic;
        font-weight: 900;
        font-size: 130px;
        color: #ffffff;
        line-height: 1;
        margin-right: 4px;
        display: inline-block;
      }

      .logo-m-wrapper .m-letter {
        position: relative;
        z-index: 1;
      }

      .circuit-svg {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 2;
      }

      /* --- TEXTO "ister" BLANCO --- */
      .text-ister {
        font-style: italic;
        font-weight: 900;
        font-size: 110px;
        color: #ffffff;
        letter-spacing: -2px;
        line-height: 1;
      }

      /* --- TEXTO "Softs" CON DEGRADADO DE CORTE FIJO --- */
      .text-softs-part {
        font-style: italic;
        font-weight: 900;
        font-size: 110px;
        letter-spacing: -2px;
        line-height: 1;
        background: linear-gradient(to bottom, #fce068 50%, #e86b05 50%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }

      /* --- LUPA (REEMPLAZA LA "o") --- */
      .lupa-wrapper {
        display: inline-block;
        width: 90px;
        height: 90px;
        vertical-align: baseline;
        position: relative;
        margin: 0 -3px;
        transform: translateY(10px);
        flex-shrink: 0;
      }

      .lupa-svg {
        width: 100%;
        height: 100%;
        overflow: visible;
        display: block;
      }
    </style>
  </head>
  <body>
    <div class="logo-container">
      <!-- Letra M con circuitos PCB internos -->
      <div class="logo-m-wrapper">
        <span class="m-letter">M</span>
        <svg class="circuit-svg" viewBox="0 0 115 130" xmlns="http://www.w3.org/2000/svg">
          <!--
            Pista 1 (extremo izquierdo):
            Nodo superior, baja recto, quiebre diagonal derecha, baja vertical, nodo inferior.
          -->
          <path
            d="M 20 28 L 20 52 L 27 63 L 27 98"
            stroke="#0c4331"
            stroke-width="3"
            fill="none"
            stroke-linejoin="round"
            stroke-linecap="round"
          />
          <circle cx="20" cy="28" r="4.5" fill="#0c4331" />
          <circle cx="10" cy="98" r="4.5" fill="#0c4331" />

          <!--
            Pista 2 (centro-izquierda):
            Baja desde borde superior, quiebre a la derecha, sale por borde inferior.
          -->
          <path
            d="M 41 0 L 41 54 L 54 54 L 54 130"
            stroke="#0c4331"
            stroke-width="3.5"
            fill="none"
            stroke-linejoin="round"
            stroke-linecap="round"
          />

          <!--
            Pista 3 (diagonal central):
            Nodo superior, diagonal paralela a la forma de la M, nodo inferior.
          -->
          <path
            d="M 58 20 L 73 68"
            stroke="#0c4331"
            stroke-width="3.5"
            fill="none"
            stroke-linecap="round"
          />
          <circle cx="58" cy="20" r="4.5" fill="#0c4331" />
          <circle cx="73" cy="68" r="4.5" fill="#0c4331" />

          <!--
            Pista 4 (extremo derecho):
            Segmento corto desde borde superior hasta nodo medio,
            luego desde nodo medio hasta borde inferior.
          -->
          <path
            d="M 92 0 L 92 38"
            stroke="#0c4331"
            stroke-width="3.5"
            fill="none"
            stroke-linecap="round"
          />
          <circle cx="92" cy="40" r="4.5" fill="#0c4331" />
          <path
            d="M 92 53 L 92 130"
            stroke="#0c4331"
            stroke-width="3.5"
            fill="none"
            stroke-linecap="round"
          />
        </svg>
      </div>

      <!-- Texto "ister" -->
      <span class="text-ister">ister&nbsp;</span>

      <!-- Letra "S" de "Softs" -->
      <span class="text-softs-part">S</span>

      <!-- Lupa con gráfico financiero (reemplaza la "o") -->
      <span class="lupa-wrapper">
        <svg class="lupa-svg" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <!-- Degradado de corte fijo para el aro: amarillo arriba, naranja abajo -->
            <linearGradient id="lupa-grad" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#fce068" />
              <stop offset="50%" stop-color="#fce068" />
              <stop offset="50%" stop-color="#e86b05" />
              <stop offset="100%" stop-color="#e86b05" />
            </linearGradient>

            <!-- Degradado direccional para el mango (a lo largo del mango) -->
            <linearGradient
              id="mango-grad"
              x1="0"
              y1="0"
              x2="1"
              y2="1"
              gradientUnits="objectBoundingBox"
            >
              <stop offset="0%" stop-color="#fce068" />
              <stop offset="60%" stop-color="#f0a010" />
              <stop offset="100%" stop-color="#e86b05" />
            </linearGradient>

            <!-- Clip circular para el interior de la lupa -->
            <clipPath id="lupa-interior-clip">
              <circle cx="47" cy="47" r="33" />
            </clipPath>
          </defs>

          <!-- Fondo verde oscuro del interior de la lupa -->
          <circle cx="47" cy="47" r="33" fill="#0c4331" />

          <!-- Contenido interior recortado -->
          <g clip-path="url(#lupa-interior-clip)">
            <!-- Barras naranjas del gráfico -->
            <rect x="28" y="52" width="9" height="15" fill="#e86b05" rx="1.5" />
            <rect x="42" y="42" width="9" height="25" fill="#e86b05" rx="1.5" />
            <rect x="56" y="31" width="9" height="36" fill="#e86b05" rx="1.5" />

            <!-- Línea de tendencia blanca con quiebre en V -->
            <polyline
              points="21,57 31,45 37,51 64,23"
              fill="none"
              stroke="#ffffff"
              stroke-width="7"
              stroke-linejoin="miter"
              stroke-linecap="round"
            />
            <!-- Punta de flecha blanca -->
            <polygon points="50,30 66,18 62,34" fill="#ffffff" />
          </g>

          <!-- Aro de la lupa con degradado de corte fijo -->
          <circle cx="47" cy="47" r="38" fill="none" stroke="url(#lupa-grad)" stroke-width="10" />

          <!-- Sombreado interior sutil en el borde superior del aro -->
          <path
            d="M 14 47 A 33 33 0 0 1 80 47"
            fill="none"
            stroke="#ffffff"
            stroke-width="2.5"
            opacity="0.18"
            stroke-linecap="round"
          />

          <!-- Mango de la lupa con degradado direccional -->
          <line
            x1="71"
            y1="71"
            x2="102"
            y2="102"
            stroke="url(#mango-grad)"
            stroke-width="14"
            stroke-linecap="round"
          />
        </svg>
      </span>

      <!-- Texto "fts" de "Softs" -->
      <span class="text-softs-part">fts</span>
    </div>
  </body>
</html>
